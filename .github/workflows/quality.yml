name: Recipe quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit runtime and tooling dependencies
        run: npm audit --audit-level=low --fetch-retries=0 --fetch-timeout=30000
      - run: npm test
      - run: npm run typecheck:cms
      - run: npm run typecheck
      - run: npm run check:svelte
      - run: npm run lint
      - run: npm run build
        env:
          PUBLIC_DIRECTUS_URL: ''
      - run: npm run build:fixture
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_DIRECTUS_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: npm ci
      - run: npm run build:fixture
      - name: Static multi-page routes, 404s, security and cache headers
        run: python tests/cloudflare_smoke.py
      - name: Encoded and numeric recipe routes with escaped CMS rendering
        run: python tests/rendering-regression.py
      - name: Retain Pages smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-evidence-${{ github.sha }}
          path: |
            work/cloudflare-evidence/runtime.log
            work/cloudflare-evidence/responses.json
            work/cloudflare-evidence/rendering-build.log
          retention-days: 7
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_DIRECTUS_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: tests/browser-requirements.txt
      - run: python -m pip install --requirement tests/browser-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm run build:fixture
      - name: Verify failure evidence and server cleanup
        run: python -m unittest discover -s tests -p 'test_browser_harness.py'
      - name: Hydrated Svelte, recipe and CMS state regressions
        run: python tests/run_browser_ci.py
      - name: Retain browser evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: work/browser-evidence/
          retention-days: 7
          if-no-files-found: warn
